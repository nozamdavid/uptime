# PostgreSQL Client Authentication Configuration File
# Uptime VPS staging configuration
# Local Unix domain socket and loopback TCP connections only.
# No external network access; no trust authentication.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local Unix domain socket connections
local   all             postgres                                peer
local   uptime_staging  uptime_staging_owner                    peer
local   all             all                                     peer

# IPv4 local connections (SCRAM-SHA-256 only)
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections (SCRAM-SHA-256 only)
host    all             all             ::1/128                 scram-sha-256

# Replication connections (local loopback only)
local   replication     all                                     peer
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256
