# PostgreSQL 18 conservative tuning for uptime staging on 2 vCPU / 8 GB VPS
# Co-located with Pangolin / Traefik / Gerbil containers

# - Connection & Network -
# Listen on loopback IPv4 and IPv6 only; Unix socket in /var/run/postgresql
listen_addresses = '127.0.0.1, ::1'
port = 5432
max_connections = 80

# - SSL / TLS Configuration -
# Cloudflare Origin CA certificate for postgres-staging.uptime.noz.am
ssl = on
ssl_cert_file = '/etc/ssl/certs/postgres-staging.crt'
ssl_key_file = '/etc/ssl/private/postgres-staging.key'

# - Memory -
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 4MB
maintenance_work_mem = 64MB

# - Write-Ahead Log & Durability -
wal_level = replica
fsync = on
full_page_writes = on
synchronous_commit = on
wal_sync_method = fdatasync
min_wal_size = 80MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# - Timezone & Locale -
timezone = 'UTC'
log_timezone = 'UTC'

# - Timeouts -
# Reasonable lock and idle-in-transaction limits; statement_timeout=0 prevents short timeouts on global imports
statement_timeout = 0
lock_timeout = 30s
idle_in_transaction_session_timeout = 10min

# - Logging -
log_line_prefix = '%m [%p] %q%u@%d '
log_min_messages = warning
log_min_error_statement = error
