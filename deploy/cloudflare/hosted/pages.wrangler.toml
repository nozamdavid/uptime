# Production Pages project. This is the project that owns the uptime.noz.am
# custom domain, so deploying here is what puts the hosted app on that origin.
name = "uptime"
compatibility_date = "2026-08-30"
compatibility_flags = ["global_fetch_strictly_public"]
pages_build_output_dir = "../../../apps/web/dist"

[[services]]
binding = "API"
service = "uptime-hosted-api"

[[services]]
binding = "IMPORTED_API"
service = "uptime-api"

[[services]]
binding = "IMPORTED_REPORTER"
service = "uptime-reporter"

[[r2_buckets]]
binding = "IMPORTED_REPORTS"
bucket_name = "uptime-reports"
