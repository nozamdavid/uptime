database_name = "uptime-tenant-004"
database_id = "REPLACE_WITH_TENANT_004_DATABASE_ID"
migrations_dir = "../../../packages/cloudflare/src/migrations"
[[d1_databases]]
binding = "TENANT_DB_005"
database_name = "uptime-tenant-005"
database_id = "REPLACE_WITH_TENANT_005_DATABASE_ID"
