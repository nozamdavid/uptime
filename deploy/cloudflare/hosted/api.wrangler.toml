[vars]
ENVIRONMENT = "production"
PUBLIC_ORIGIN = "https://REPLACE_WITH_PAGES_ORIGIN"
WEB_ORIGIN = "https://REPLACE_WITH_PAGES_ORIGIN"
OPERATOR_DIDS = "REPLACE_WITH_OPERATOR_DID"
REGIONS_LIST = "eu-west,us-east,asia"
SESSION_TTL_SECONDS = "604800"

# Set with wrangler secret put. Never commit values.
# SESSION_SECRET
# CREDENTIAL_ENCRYPTION_SECRET
# OAUTH_STORAGE_SECRET
