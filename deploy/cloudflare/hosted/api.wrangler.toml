name = "uptime-hosted-api"
main = "../../../apps/api-worker/src/index.ts"
compatibility_date = "2026-08-30"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[limits]
cpu_ms = 100

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "uptime-control"
database_id = "REPLACE_WITH_CONTROL_D1_DATABASE_ID"
migrations_dir = "../../../packages/cloudflare/src/control-migrations"

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "uptime-control"
database_id = "REPLACE_WITH_CONTROL_D1_DATABASE_ID"
migrations_dir = "../../../packages/cloudflare/src/control-migrations"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "uptime-reports"

[[d1_databases]]
binding = "TENANT_DB_000"
database_name = "uptime-tenant-000"
database_id = "REPLACE_WITH_TENANT_000_DATABASE_ID"
migrations_dir = "../../../packages/cloudflare/src/migrations"
[[d1_databases]]
binding = "TENANT_DB_001"
database_name = "uptime-tenant-001"
database_id = "REPLACE_WITH_TENANT_001_DATABASE_ID"
migrations_dir = "../../../packages/cloudflare/src/migrations"
