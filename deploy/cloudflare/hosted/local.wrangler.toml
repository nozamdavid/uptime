name = "uptime-hosted-local"
main = "../../../apps/api-worker/src/index.ts"
compatibility_date = "2026-08-30"
compatibility_flags = ["global_fetch_strictly_public"]

[[d1_databases]]
binding = "DB"
database_name = "uptime-local-control"
database_id = "00000000-0000-4000-8000-000000000000"
migrations_dir = "../../../packages/cloudflare/src/control-migrations"

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "uptime-local-control"
database_id = "00000000-0000-4000-8000-000000000000"
migrations_dir = "../../../packages/cloudflare/src/control-migrations"

[[d1_databases]]
binding = "TENANT_DB_000"
database_name = "uptime-local-tenant-000"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "../../../packages/cloudflare/src/migrations"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "uptime-local-reports"

[vars]
ENVIRONMENT = "development"
PUBLIC_ORIGIN = "http://127.0.0.1:5176"
WEB_ORIGIN = "http://127.0.0.1:5176"
REGIONS_LIST = "eu-west,us-east,asia"
SESSION_TTL_SECONDS = "604800"
