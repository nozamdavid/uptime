name = "uptime-hosted-coordinator"
main = "../../../apps/coordinator-worker/src/index.ts"
compatibility_date = "2026-08-30"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true
keep_vars = true

[limits]
cpu_ms = 1000

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[queues.producers]]
binding = "TENANT_JOBS"
queue = "uptime-tenant-jobs"

[[queues.consumers]]
queue = "uptime-tenant-jobs"
max_batch_size = 1
max_concurrency = 1
max_retries = 3
dead_letter_queue = "uptime-tenant-jobs-dead"

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "uptime-control"
database_id = "261093f4-98e2-48c8-b84d-932b7f27af7f"
migrations_dir = "../../../packages/cloudflare/src/control-migrations"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "uptime-reports"

# Each tenant database is a static binding. Keep the inventory at ten slots.
[[d1_databases]]
binding = "TENANT_DB_000"
database_name = "uptime-tenant-000"
database_id = "6af68e2a-f8a9-4d80-b04f-c42f35b1897b"
migrations_dir = "../../../packages/cloudflare/src/migrations"
[[d1_databases]]
binding = "TENANT_DB_001"
database_name = "uptime-tenant-001"
database_id = "6d2f4022-a685-4b85-8b2f-11b2e44006fd"
migrations_dir = "../../../packages/cloudflare/src/migrations"
[[d1_databases]]
binding = "TENANT_DB_002"
database_name = "uptime-tenant-002"
database_id = "15040e32-414e-48f9-95a2-29d4d5b8d2ba"
migrations_dir = "../../../packages/cloudflare/src/migrations"
[[d1_databases]]
binding = "TENANT_DB_003"
database_name = "uptime-tenant-003"
database_id = "1683e140-cac1-4887-96bd-78717d74a955"
migrations_dir = "../../../packages/cloudflare/src/migrations"
[[d1_databases]]
binding = "TENANT_DB_004"
database_name = "uptime-tenant-004"
database_id = "4118d771-1bff-4a09-878b-927669b4de28"
migrations_dir = "../../../packages/cloudflare/src/migrations"
[[d1_databases]]
binding = "TENANT_DB_005"
database_name = "uptime-tenant-005"
database_id = "652929c9-021c-46e2-a8e8-537d1ee56e9f"
migrations_dir = "../../../packages/cloudflare/src/migrations"
[[d1_databases]]
binding = "TENANT_DB_006"
database_name = "uptime-tenant-006"
database_id = "81d670cc-5af5-470e-93d7-c4bd54ee2522"
migrations_dir = "../../../packages/cloudflare/src/migrations"
[[d1_databases]]
