name = "uptime-staging-hosted-coordinator"
main = "../../../../apps/coordinator-worker/src/index.ts"
compatibility_date = "2026-08-30"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[limits]
cpu_ms = 1000

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[queues.producers]]
binding = "TENANT_JOBS"
queue = "uptime-staging-tenant-jobs"

[[queues.consumers]]
queue = "uptime-staging-tenant-jobs"
max_batch_size = 1
max_concurrency = 1
max_retries = 3
dead_letter_queue = "uptime-staging-tenant-jobs-dead"

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "uptime-staging-control"
database_id = "cabb1e81-0934-4940-a7d6-7129fe15d649"
migrations_dir = "../../../../packages/cloudflare/src/control-migrations"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "uptime-staging-reports"

[[d1_databases]]
binding = "STAGING_IMPORTED_DB"
database_name = "uptime-staging"
database_id = "3900c94a-82a0-4422-a5f8-1a56b781cea7"
migrations_dir = "../../../../packages/cloudflare/src/migrations"

[vars]
ENVIRONMENT = "staging"
REGIONS_LIST = "eu-west,us-east,asia"
WORKERS_URL_DOMAIN = "david-8af.workers.dev"
PROBE_WORKER_NAME_PREFIX = "uptime-staging-hosted-probe-"
DETAILED_RESULTS_RETENTION_DAYS = "1"
DNS_DIAGNOSTICS_RETENTION_DAYS = "30"
REPORT_INTERVAL_SECONDS = "60"
NOTIFICATION_MAX_ATTEMPTS = "8"
COORDINATOR_MONITOR_BATCH = "50"
COORDINATOR_PROBE_CONCURRENCY = "32"

# Secrets: PROBE_SIGNING_SECRET and CREDENTIAL_ENCRYPTION_SECRET.

