# Cloudflare for SaaS Fallback Origin Gateway Worker for staging.
#
# This Worker serves as the fallback origin for Cloudflare for SaaS Custom Hostnames.
# When a customer points their custom domain (e.g. status.customer.com) via CNAME to
# the configured fallback target, Cloudflare routes public HTTP requests here.
#
# Requests are strictly validated (only GET/HEAD to / and /status.json), stripped of
# credentials, and dispatched via Service Binding to uptime-staging-oauth-api.
#
# DO NOT invent zone/DNS/route IDs here. Real zone and fallback domain bindings are
# configured in Cloudflare dashboard / terraform when activating Cloudflare for SaaS.

name = "uptime-staging-status-domains"
main = "../../status-domain-gateway/_worker.js"
compatibility_date = "2026-08-30"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false
keep_vars = true

[limits]
cpu_ms = 50

[observability]
enabled = true

[vars]
APP_ORIGIN = "https://uptime.staging.internal"

# Service binding directly to API Worker serving public custom-status routes
[[services]]
binding = "API"
service = "uptime-staging-oauth-api"
