name = "uptime-staging-api"
main = "./oauth-proxy.ts"
compatibility_date = "2026-08-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[[hyperdrive]]
binding = "POSTGRES"
id = "e51168b91d484babb46d68ef476d66b6"

[[services]]
binding = "OAUTH"
service = "uptime-staging-oauth-api"

[vars]
ENVIRONMENT = "staging"
REGIONS_LIST = "us-east,us-west,canada-central,eu-west,eu-north,eu-south,asia,asia-east,asia-south"
SESSION_TTL_SECONDS = "604800"
SESSION_COOKIE_SECURE = "true"
SESSION_COOKIE_SAMESITE = "lax"
WEB_ORIGIN = "https://uptime-staging.pages.dev"
ALLOWED_ORIGINS = "https://uptime.noz.am"
