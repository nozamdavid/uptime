# Coordinator Worker (minute check scheduling, notifications, retention).
# Report publication runs on the separately scheduled reporter Worker.
#
# Deploy with:
#   wrangler deploy --config deploy/cloudflare/coordinator/wrangler.toml

name = "uptime-coordinator"
main = "../../../apps/coordinator-worker/src/index.ts"
compatibility_date = "2026-08-30"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[observability]
enabled = true

# Every minute. Cloudflare cron triggers are UTC and do not provide exact
# wall-clock execution; scheduling uses persisted windows rather than relying on
# precise invocation timing.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "uptime"
database_id = "17c009df-5b56-44cc-9776-73e0f1775b0f"
migrations_dir = "../../../packages/cloudflare/src/migrations"

# Report storage is shared with the separately scheduled reporter.
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "uptime-reports"

[vars]
ENVIRONMENT = "production"
REGIONS_LIST = "us-east,us-west,canada-central,eu-west,eu-north,eu-south,asia,asia-east,asia-south"
WORKERS_URL_DOMAIN = "david-8af.workers.dev"
PROBE_WORKER_NAME_PREFIX = "uptime-probe-"
DETAILED_RESULTS_RETENTION_DAYS = "30"
# Daily aggregates are preserved permanently.
DNS_DIAGNOSTICS_RETENTION_DAYS = "30"
PROBE_REQUEST_MAX_SKEW_SECONDS = "60"
REPORT_INTERVAL_SECONDS = "60"
REPORT_SCHEDULE_DISABLED = "true"
NOTIFICATION_MAX_ATTEMPTS = "8"
# Bound per-invocation work; add fan-out only when measured scale requires it.
COORDINATOR_MONITOR_BATCH = "50"
COORDINATOR_PROBE_CONCURRENCY = "32"

# Secrets, set with `wrangler secret put` and never committed:
#   PROBE_SIGNING_SECRET          >= 32 chars, shared with every probe Worker
#   CREDENTIAL_ENCRYPTION_SECRET  >= 32 chars, AES-GCM key for provider credentials
