# Docker Compose specification for Uptime Staging Node API on VPS 217.217.227.164.
#
# Isolated service: Runs exclusively in its own project and namespace.
# Does NOT touch, stop, or interfere with Pangolin (/opt/pangolin) or PostgreSQL 18.
#
# Networking: Uses `network_mode: host` to bind strictly to loopback:
#   - Ingress: Listens on 127.0.0.1:3001 (cloudflared forwards tunnel traffic here)
#   - Egress: Connects directly to PostgreSQL on 127.0.0.1:5432
#   - Zero public ports exposed.
services:
  uptime-staging-node-api:
    container_name: uptime-staging-node-api
    image: uptime-staging-api:vps-20261006
    build:
      context: .
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    network_mode: host
    env_file:
      - api.env
    environment:
      # Staging only. Budget enforcement is off while this is "true". To restore it, delete
      # this line (or set it to "false") and recreate the service. Production never sets it.
      - BUDGET_ENFORCEMENT_DISABLED=true
      - POSTGRES_RUNTIME_CATALOG_FILE=/app/catalog.json
      - API_HOST=127.0.0.1
      - API_PORT=3001
      - API_TRUSTED_PROXIES=127.0.0.1,::1
    volumes:
      - ./catalog.json:/app/catalog.json:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    stop_signal: SIGTERM
    stop_grace_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  # Minute scheduler: delivers due URLs through the signed regional probe endpoints.
  # Opens no ports. Run exactly one instance, and only after the Cloudflare staging
  # coordinator cron is removed (see README section 8). SCHEDULER_ENABLED=false in
  # scheduler.env keeps it idle. Start it by name so the API container is never recreated:
  #   docker compose up -d --no-build uptime-staging-node-scheduler
  uptime-staging-node-scheduler:
    container_name: uptime-staging-node-scheduler
    image: uptime-staging-scheduler:vps-20261006c
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    restart: unless-stopped
    network_mode: host
    env_file:
      - scheduler.env
    environment:
      # Staging only. Same switch and rollback as the API service above.
      - BUDGET_ENFORCEMENT_DISABLED=true
      - POSTGRES_RUNTIME_CATALOG_FILE=/app/catalog.json
    volumes:
      - ./catalog.json:/app/catalog.json:ro
    stop_signal: SIGTERM
    stop_grace_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'
