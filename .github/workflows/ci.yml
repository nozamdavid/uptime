name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: uptime-test
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Set up Postgres test database
        run: |
          grep -v uptime_staging deploy/postgresql/vps/init-uptime-test.sql | docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d postgres -v ON_ERROR_STOP=1
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE uptime_test_admin PASSWORD 'uptimetestadmin'"
      - run: pnpm test
        env:
          POSTGRES_TEST_ADMIN_URL: postgresql://uptime_test_admin:uptimetestadmin@localhost:5432/uptime_migration_test
      - run: pnpm generate:wrangler -- --check
      - run: pnpm --filter @uptime/web build
      - run: scripts/tests/deploy-workers.sh
      - run: scripts/tests/reset-admin.sh
      - name: Validate Docker Compose
        env:
          DATABASE_URL: postgresql://uptime:test@database.example.com:5432/uptime
          ADMIN_PASSWORD_HASH: $argon2id$v=19$m=65536,t=3,p=4$c2FsdA$aGFzaA
          SESSION_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PROBE_SIGNING_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          WORKERS_URL_DOMAIN: account.workers.dev
        run: docker compose config --quiet
