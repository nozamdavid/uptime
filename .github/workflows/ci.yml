name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm generate:wrangler -- --check
      - run: node --test deploy/cloudflare/hosted/gateway.test.mjs
      - run: pnpm --filter @uptime/web build
      - run: pnpm --filter @uptime/api-worker exec wrangler deploy --config ../../deploy/cloudflare/hosted/api.wrangler.toml --dry-run
      - run: pnpm --filter @uptime/coordinator-worker exec wrangler deploy --config ../../deploy/cloudflare/hosted/coordinator.wrangler.toml --dry-run
      - run: scripts/tests/deploy-workers.sh
      - run: scripts/tests/deploy-app-workers.sh
      - run: scripts/tests/provision-tenant-pool.sh
      - run: scripts/tests/deploy-hosted-workers.sh
      - run: scripts/tests/bootstrap-operator-workspace.sh
      - run: scripts/tests/register-staging-import.sh
      - run: node --test deploy/cloudflare/staging/pages/gateway.test.mjs
      - run: scripts/tests/reset-admin.sh
      - name: Validate Docker Compose
        env:
          DATABASE_URL: postgresql://uptime:test@database.example.com:5432/uptime
          ADMIN_PASSWORD_HASH: $argon2id$v=19$m=65536,t=3,p=4$c2FsdA$aGFzaA
          SESSION_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PROBE_SIGNING_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          WORKERS_URL_DOMAIN: account.workers.dev
        run: docker compose config --quiet
